<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | JPTS Grade System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h4><i class="bi bi-mortarboard-fill"></i> JPTS</h4>
            </div>
            <ul class="sidebar-nav">
                <li class="nav-item"><a href="#" data-page="dashboard" class="nav-link active"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li class="nav-item"><a href="#" data-page="students" class="nav-link"><i class="bi bi-people"></i> Students</a></li>
                <li class="nav-item"><a href="#" data-page="lecturers" class="nav-link"><i class="bi bi-person-badge"></i> Lecturers</a></li>
                <li class="nav-item"><a href="#" data-page="courses" class="nav-link"><i class="bi bi-book"></i> Courses</a></li>
                <li class="nav-item"><a href="#" data-page="results" class="nav-link"><i class="bi bi-clipboard-data"></i> Results</a></li>
                <li class="nav-item"><a href="#" data-page="transcript" class="nav-link"><i class="bi bi-file-text"></i> Transcript</a></li>
                <li class="nav-item"><a href="#" data-page="reports" class="nav-link"><i class="bi bi-graph-up"></i> Reports</a></li>
                <li class="nav-item"><a href="#" data-page="settings" class="nav-link"><i class="bi bi-gear"></i> Settings</a></li>
                <li class="nav-item"><a href="#" id="logoutBtn" class="nav-link text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <nav class="topbar glass-nav">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
                    <div class="d-flex align-items-center gap-3">
                        <div class="theme-toggle">
                            <i class="bi bi-sun-fill" id="lightModeIcon"></i>
                            <i class="bi bi-moon-fill d-none" id="darkModeIcon"></i>
                        </div>
                        <div class="dropdown">
                            <a href="#" class="dropdown-toggle" data-bs-toggle="dropdown">
                                <i class="bi bi-bell"></i>
                                <span class="notification-badge" id="notificationBadge">0</span>
                            </a>
                            <div class="dropdown-menu dropdown-menu-end notifications-dropdown">
                                <h6 class="dropdown-header">Notifications</h6>
                                <div id="notificationList"></div>
                            </div>
                        </div>
                        <div class="dropdown">
                            <a href="#" class="dropdown-toggle d-flex align-items-center" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle fs-4"></i>
                                <span id="userName" class="ms-2">User</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#" data-page="profile"><i class="bi bi-person"></i> Profile</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="#" id="logoutBtn2"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>

            <div class="content-area p-4" id="contentArea">
                <!-- Dynamic content loads here -->
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal fade" id="genericModal" tabindex="-1"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/result-engine.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/charts.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
