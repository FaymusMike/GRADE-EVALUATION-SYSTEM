<!-- dashboard.html - COMPLETE FIXED VERSION -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Prevent bfcache and extension conflicts -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dashboard | JPTS Grade Evaluation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Dashboard specific styles */
        .dashboard-wrapper {
            display: flex;
            min-height: 100vh;
            background: var(--bg-light);
        }
        .quick-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .welcome-banner {
            background: var(--gradient-primary);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            color: white;
        }
        .activity-feed {
            max-height: 400px;
            overflow-y: auto;
        }
        .activity-item {
            padding: 0.75rem;
            border-left: 3px solid var(--primary-color);
            margin-bottom: 0.5rem;
            background: var(--card-bg);
            border-radius: 8px;
        }
        .status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-pending { background: #ffc107; color: #000; }
        .status-approved { background: #28a745; color: #fff; }
        .status-published { background: #17a2b8; color: #fff; }
        .status-draft { background: #6c757d; color: #fff; }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar - Will be dynamically populated -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h4><i class="bi bi-mortarboard-fill"></i> <span>JPTS</span></h4>
                <button class="sidebar-collapse-btn" id="sidebarCollapseBtn">
                    <i class="bi bi-chevron-left"></i>
                </button>
            </div>
            <ul class="sidebar-nav" id="sidebarNav">
                <div class="text-center py-4">
                    <div class="spinner-border spinner-border-sm text-primary"></div>
                    <p class="small mt-2 text-muted">Loading menu...</p>
                </div>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Navigation Bar -->
            <nav class="topbar">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <div class="d-flex align-items-center gap-3">
                        <button class="sidebar-toggle" id="sidebarToggle">
                            <i class="bi bi-list"></i>
                        </button>
                        <div class="breadcrumb-nav">
                            <span class="text-muted">Dashboard</span>
                            <i class="bi bi-chevron-right small mx-1"></i>
                            <span id="currentPageTitle" class="fw-semibold">Overview</span>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <!-- Search -->
                        <div class="search-bar d-none d-md-block">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-transparent border-end-0">
                                    <i class="bi bi-search"></i>
                                </span>
                                <input type="text" class="form-control border-start-0" placeholder="Search..." id="globalSearch">
                            </div>
                        </div>
                        <!-- Theme Toggle -->
                        <div class="theme-toggle" id="themeToggle">
                            <i class="bi bi-sun-fill" id="lightModeIcon"></i>
                            <i class="bi bi-moon-fill d-none" id="darkModeIcon"></i>
                        </div>
                        <!-- Notifications -->
                        <div class="dropdown">
                            <a href="#" class="position-relative" data-bs-toggle="dropdown">
                                <i class="bi bi-bell fs-5"></i>
                                <span class="notification-badge" id="notificationBadge">0</span>
                            </a>
                            <div class="dropdown-menu dropdown-menu-end notifications-dropdown p-0">
                                <div class="dropdown-header bg-primary text-white">
                                    <strong>Notifications</strong>
                                </div>
                                <div id="notificationList" class="notification-list" style="max-height: 300px; overflow-y: auto;">
                                    <div class="text-center py-3 text-muted small">Loading...</div>
                                </div>
                                <div class="dropdown-footer text-center p-2 border-top">
                                    <a href="#" class="small text-decoration-none" onclick="UI.loadPage('notifications')">View All</a>
                                </div>
                            </div>
                        </div>
                        <!-- User Profile -->
                        <div class="dropdown">
                            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                                <div class="user-avatar">
                                    <i class="bi bi-person-circle fs-4 text-primary"></i>
                                </div>
                                <span class="ms-2 d-none d-md-inline" id="userName">User</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#" data-page="profile">
                                    <i class="bi bi-person me-2"></i> My Profile
                                </a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="#" id="logoutBtn2">
                                    <i class="bi bi-box-arrow-right me-2"></i> Logout
                                </a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Dynamic Content Area -->
            <div class="content-area p-4" id="contentArea">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted">Loading dashboard...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Global Modals -->
    <div class="modal fade" id="genericModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Modal Title</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Modal content goes here
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts - ORDER MATTERS! -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/result-engine.js"></script>
    <script src="assets/js/charts.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/app.js"></script>
    
    <script>
        // Immediate session check before anything else
        (function() {
            // Check if we have a valid session
            const session = localStorage.getItem('session') || sessionStorage.getItem('session');
            if (!session) {
                console.log('No session found, redirecting to login');
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const sessionData = JSON.parse(session);
                const sessionAge = Date.now() - sessionData.loginTime;
                if (sessionAge > 3600000) { // 1 hour timeout
                    console.log('Session expired, redirecting to login');
                    localStorage.removeItem('session');
                    sessionStorage.removeItem('session');
                    window.location.href = 'login.html';
                    return;
                }
                console.log('Valid session found for user:', sessionData.user?.email);
            } catch (e) {
                console.error('Session parsing error:', e);
                window.location.href = 'login.html';
            }
        })();
        
        // Sidebar toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('sidebar');
            const sidebarCollapseBtn = document.getElementById('sidebarCollapseBtn');
            
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('collapsed');
                    localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
                });
            }
            
            if (sidebarCollapseBtn) {
                sidebarCollapseBtn.addEventListener('click', function() {
                    sidebar.classList.toggle('collapsed');
                    localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
                });
            }
            
            // Restore sidebar state
            const collapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (collapsed && sidebar) {
                sidebar.classList.add('collapsed');
            }
            
            // Global search functionality
            const globalSearch = document.getElementById('globalSearch');
            if (globalSearch) {
                globalSearch.addEventListener('keyup', function(e) {
                    if (e.key === 'Enter') {
                        const searchTerm = this.value.toLowerCase();
                        if (searchTerm) {
                            if (typeof UI !== 'undefined' && UI.showToast) {
                                UI.showToast(`Searching for: ${searchTerm}`, 'info');
                            }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
