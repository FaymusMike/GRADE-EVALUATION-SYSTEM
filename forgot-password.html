<!-- forgot-password.html - Password Recovery -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Prevent bfcache and extension conflicts -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Forgot Password | JPTS Institute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .recovery-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
            animation: fadeIn 0.5s;
        }
    </style>
</head>
<body class="auth-body">
    <div class="container">
        <div class="recovery-container">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-mortarboard-fill fs-1 text-primary"></i>
                        <h3 class="mt-2">Reset Password</h3>
                        <p class="text-muted">JPTS Institute Grade System</p>
                    </div>

                    <!-- Step 1: Email -->
                    <div id="step1" class="step active">
                        <div class="text-center mb-4">
                            <i class="bi bi-envelope fs-1 text-primary"></i>
                            <p class="mt-2">Enter your registered email address to receive a password reset link.</p>
                        </div>
                        <form id="emailForm">
                            <div class="mb-3">
                                <label>Email Address</label>
                                <input type="email" class="form-control" id="resetEmail" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                        </form>
                    </div>

                    <!-- Step 2: OTP -->
                    <div id="step2" class="step">
                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock fs-1 text-primary"></i>
                            <p class="mt-2">Enter the 6-digit code sent to your email.</p>
                        </div>
                        <form id="otpForm">
                            <div class="mb-3">
                                <label>Verification Code</label>
                                <input type="text" class="form-control" id="otpCode" maxlength="6" required placeholder="123456">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Verify Code</button>
                        </form>
                        <div class="text-center mt-3">
                            <button class="btn btn-link" onclick="resendOTP()">Resend Code</button>
                        </div>
                    </div>

                    <!-- Step 3: New Password -->
                    <div id="step3" class="step">
                        <div class="text-center mb-4">
                            <i class="bi bi-key fs-1 text-primary"></i>
                            <p class="mt-2">Create a new strong password for your account.</p>
                        </div>
                        <form id="passwordForm">
                            <div class="mb-3">
                                <label>New Password</label>
                                <input type="password" class="form-control" id="newPassword" required>
                            </div>
                            <div class="mb-3">
                                <label>Confirm Password</label>
                                <input type="password" class="form-control" id="confirmNewPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
                        </form>
                    </div>

                    <div class="text-center mt-4">
                        <a href="login.html" class="text-decoration-none">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        let resetEmail = '';
        let generatedOTP = '';

        document.getElementById('emailForm').addEventListener('submit', (e) => {
            e.preventDefault();
            resetEmail = document.getElementById('resetEmail').value;
            
            // Check if email exists
            const user = Storage.findOne('users', u => u.email === resetEmail) || 
                         Storage.findOne('students', s => s.email === resetEmail);
            
            if (!user) {
                Auth.showToast('Email not found in our records', 'danger');
                return;
            }
            
            // Generate OTP
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            Auth.showToast(`OTP sent: ${generatedOTP} (Demo)`, 'success');
            
            // Move to step 2
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        });

        document.getElementById('otpForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const enteredOTP = document.getElementById('otpCode').value;
            
            if (enteredOTP !== generatedOTP) {
                Auth.showToast('Invalid verification code', 'danger');
                return;
            }
            
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
        });

        document.getElementById('passwordForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;
            
            if (newPassword.length < 8) {
                Auth.showToast('Password must be at least 8 characters', 'warning');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                Auth.showToast('Passwords do not match', 'danger');
                return;
            }
            
            // Update password
            let user = Storage.findOne('users', u => u.email === resetEmail);
            if (user) {
                Storage.update('users', user.id, { password: btoa(newPassword) });
            } else {
                let student = Storage.findOne('students', s => s.email === resetEmail);
                if (student) {
                    Storage.update('students', student.id, { password: btoa(newPassword) });
                }
            }
            
            Auth.showToast('Password reset successful! Please login with your new password.', 'success');
            setTimeout(() => window.location.href = 'login.html', 2000);
        });

        function resendOTP() {
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            Auth.showToast(`New OTP sent: ${generatedOTP} (Demo)`, 'success');
        }
    </script>
</body>
</html>
