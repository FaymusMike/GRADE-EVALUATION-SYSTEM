<!-- transcript.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Transcript | JPTS Institute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container mt-4">
        <div class="card shadow-lg">
            <div class="card-body p-5" id="transcriptContent">
                <!-- Transcript content dynamically generated -->
            </div>
            <div class="card-footer text-center">
                <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
                <button class="btn btn-success" id="downloadPDF"><i class="bi bi-download"></i> Download PDF</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/result-engine.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
